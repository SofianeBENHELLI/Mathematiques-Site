# Programme de spécialité mathématiques, Première générale (rentrée 2026-2027).
# Statut : confirme (texte BO n° 14 du 2 avril 2026, NOR MENE2602917A).
# Les lignes marquees note: "2026" correspondent aux nouveautés citées dans sources.md.
niveau: premiere
statut: confirme
domaines:

  - id: ALG
    nom: "Algèbre"
    chapitres:
      - id: SUI
        nom: "Suites numériques"
        competences:
          - {id: P-ALG-SUI-01, type: connaissance, txt: "Générer une suite par une formule explicite u_n = f(n) ou par récurrence u_(n+1) = f(u_n)"}
          - {id: P-ALG-SUI-02, type: capacite, txt: "Calculer des termes d'une suite, à la main, au tableur ou par programme Python"}
          - {id: P-ALG-SUI-03, type: connaissance, txt: "Suite arithmétique : définition, raison, terme général u_n = u_0 + nr"}
          - {id: P-ALG-SUI-04, type: connaissance, txt: "Suite géométrique : définition, raison, terme général u_n = u_0 q^n"}
          - {id: P-ALG-SUI-05, type: demonstration, txt: "Démontrer la formule donnant la somme 1 + 2 + ... + n, et la somme des termes consécutifs d'une suite géométrique"}
          - {id: P-ALG-SUI-06, type: capacite, txt: "Reconnaître une suite arithmétique ou géométrique : u_(n+1) - u_n constant, u_(n+1)/u_n constant", piege: "Vérifier pour tout n, pas seulement pour les premiers termes"}
          - {id: P-ALG-SUI-07, type: capacite, txt: "Étudier le sens de variation d'une suite : signe de u_(n+1) - u_n, ou comparaison à 1 du quotient si u_n > 0"}
          - {id: P-ALG-SUI-08, type: capacite, txt: "Conjecturer le comportement d'une suite (croissance, décroissance, limite éventuelle) et traiter des suites sans limite", note: "2026"}
          - {id: P-ALG-SUI-09, type: algorithme, txt: "Écrire un seuil : plus petit n tel que u_n dépasse une valeur donnée"}
          - {id: P-ALG-SUI-10, type: capacite, txt: "Modéliser une évolution à taux constant ou à pas constant par une suite géométrique ou arithmétique"}
      - id: SEC
        nom: "Second degré"
        competences:
          - {id: P-ALG-SEC-01, type: connaissance, txt: "Forme développée, canonique et factorisée d'un trinôme, et passage de l'une à l'autre"}
          - {id: P-ALG-SEC-02, type: demonstration, txt: "Établir la forme canonique et les solutions de ax² + bx + c = 0 à partir du discriminant"}
          - {id: P-ALG-SEC-03, type: capacite, txt: "Résoudre une équation du second degré, discriminant, racines, factorisation", piege: "Ne pas oublier le cas Δ = 0 (racine double) et Δ < 0 (aucune racine réelle)"}
          - {id: P-ALG-SEC-04, type: capacite, txt: "Déterminer le signe d'un trinôme selon le signe de a et de Δ, et résoudre une inéquation du second degré"}
          - {id: P-ALG-SEC-05, type: connaissance, txt: "Parabole : axe de symétrie x = -b/(2a), sommet, lien avec les variations", note: "2026"}
          - {id: P-ALG-SEC-06, type: capacite, txt: "Relier somme et produit des racines aux coefficients, en trouver une quand l'autre est connue"}
          - {id: P-ALG-SEC-07, type: capacite, txt: "Se ramener à un second degré par changement d'inconnue (x² = X) et justifier le retour à x"}

  - id: ANA
    nom: "Analyse"
    chapitres:
      - id: FON
        nom: "Fonctions : généralités"
        competences:
          - {id: P-ANA-FON-01, type: connaissance, txt: "Définition d'une fonction, ensemble de définition, image, antécédent, courbe représentative"}
          - {id: P-ANA-FON-02, type: capacite, txt: "Déterminer l'ensemble de définition d'une fonction donnée par une formule (dénominateur non nul, racine, logarithme)"}
          - {id: P-ANA-FON-03, type: capacite, txt: "Lire sur un graphique : images, antécédents, signe, variations, extremums, résolution de f(x) = k et f(x) < k"}
          - {id: P-ANA-FON-04, type: connaissance, txt: "Fonction croissante, décroissante, constante sur un intervalle ; extremum local et global"}
          - {id: P-ANA-FON-05, type: capacite, txt: "Fonction racine carrée : définition sur [0 ; +∞[, variations, courbe", note: "2026"}
          - {id: P-ANA-FON-06, type: capacite, txt: "Comparer deux fonctions : signe de f(x) - g(x), positions relatives de deux courbes"}
          - {id: P-ANA-FON-07, type: capacite, txt: "Résoudre une inéquation par un tableau de signes d'un produit ou d'un quotient", piege: "Ne jamais multiplier par une expression de signe inconnu"}
          - {id: P-ANA-FON-08, type: capacite, txt: "Construire la courbe de x ↦ f(x) + k, x ↦ k f(x) à partir de celle de f"}
      - id: DER
        nom: "Dérivation"
        competences:
          - {id: P-ANA-DER-01, type: connaissance, txt: "Taux de variation entre a et a + h : (f(a + h) - f(a))/h ; interprétation comme pente d'une sécante"}
          - {id: P-ANA-DER-02, type: connaissance, txt: "Nombre dérivé f'(a) : limite du taux de variation quand h tend vers 0 ; pente de la tangente"}
          - {id: P-ANA-DER-03, type: connaissance, txt: "Tangente en A(a ; f(a)) : équation y = f'(a)(x - a) + f(a)", piege: "Oublier f(a), ou confondre f'(a) et f(a)"}
          - {id: P-ANA-DER-04, type: capacite, txt: "Calculer un nombre dérivé à partir de la définition, pour des fonctions simples (carré, inverse)", note: "2026"}
          - {id: P-ANA-DER-05, type: capacite, txt: "Lire graphiquement un nombre dérivé et construire une tangente"}
          - {id: P-ANA-DER-06, type: capacite, txt: "Approximation affine : f(a + h) ≈ f(a) + f'(a) h pour h proche de 0, et calcul d'une valeur approchée", note: "2026"}
          - {id: P-ANA-DER-07, type: connaissance, txt: "Fonction dérivée de x ↦ x², x ↦ x^n, x ↦ 1/x, x ↦ √x, constante, x ↦ x"}
          - {id: P-ANA-DER-08, type: demonstration, txt: "Démontrer, à partir de la définition, la dérivée de la fonction carré et de la fonction inverse", note: "2026"}
          - {id: P-ANA-DER-09, type: connaissance, txt: "Dérivée d'une somme, d'un produit par un réel, d'un produit uv, d'un quotient u/v, d'une puissance"}
          - {id: P-ANA-DER-10, type: capacite, txt: "Dériver x ↦ g(ax + b) à partir de la dérivée de g", note: "2026"}
          - {id: P-ANA-DER-11, type: capacite, txt: "Calculer la dérivée d'un produit ou d'un quotient et la simplifier jusqu'à une forme factorisée exploitable", piege: "Une dérivée non factorisée ne permet pas d'étudier son signe"}
          - {id: P-ANA-DER-12, type: connaissance, txt: "Lien signe de f' et variations de f sur un intervalle ; f' s'annule en un extremum local"}
          - {id: P-ANA-DER-13, type: capacite, txt: "Dresser le tableau de variations complet : domaine, dérivée, signe, valeurs aux bornes et aux extremums"}
          - {id: P-ANA-DER-14, type: capacite, txt: "Déterminer les extremums d'une fonction et résoudre un problème d'optimisation"}
          - {id: P-ANA-DER-15, type: capacite, txt: "Exploiter le tableau de variations : nombre de solutions de f(x) = k, comparaison, encadrement, inégalité"}
          - {id: P-ANA-DER-16, type: capacite, txt: "Déterminer une fonction à partir de conditions sur f, f' ou une tangente (système sur les coefficients)"}
      - id: EXP
        nom: "Exponentielle"
        competences:
          - {id: P-ANA-EXP-01, type: connaissance, txt: "Fonction exponentielle : unique fonction dérivable égale à sa dérivée avec f(0) = 1 ; notation e^x"}
          - {id: P-ANA-EXP-02, type: connaissance, txt: "Relation fonctionnelle e^(x + y) = e^x e^y, e^(-x) = 1/e^x, e^(x - y), (e^x)^n"}
          - {id: P-ANA-EXP-03, type: connaissance, txt: "e^x > 0 pour tout x ; strictement croissante ; courbe, tangente en 0 d'équation y = x + 1"}
          - {id: P-ANA-EXP-04, type: capacite, txt: "Résoudre équations et inéquations avec exponentielles (e^a = e^b ⇔ a = b ; e^a < e^b ⇔ a < b)"}
          - {id: P-ANA-EXP-05, type: capacite, txt: "Dériver x ↦ e^(ax + b) et des expressions combinant exponentielle, produit et quotient", note: "2026"}
          - {id: P-ANA-EXP-06, type: capacite, txt: "Étudier les variations d'une fonction faisant intervenir l'exponentielle", piege: "e^x ne s'annule jamais : le signe vient de l'autre facteur"}
          - {id: P-ANA-EXP-07, type: connaissance, txt: "Lien avec les suites géométriques : (e^(an)) est géométrique de raison e^a", note: "2026"}
          - {id: P-ANA-EXP-08, type: demonstration, txt: "Démontrer que e^x ne s'annule pas et la relation e^(x + y) = e^x e^y à partir de l'équation f' = f"}
      - id: TRI
        nom: "Trigonométrie"
        competences:
          - {id: P-ANA-TRI-01, type: connaissance, txt: "Cercle trigonométrique, radian, mesure d'angle, point image, cosinus et sinus"}
          - {id: P-ANA-TRI-02, type: connaissance, txt: "Valeurs remarquables de cos et sin pour 0, π/6, π/4, π/3, π/2, π (sans calculatrice)"}
          - {id: P-ANA-TRI-03, type: connaissance, txt: "cos² x + sin² x = 1 ; parité, périodicité 2π ; cos(π - x), sin(π - x), cos(π/2 - x)"}
          - {id: P-ANA-TRI-04, type: capacite, txt: "Lire sur le cercle et sur les courbes de cos et sin : valeurs, signes, solutions graphiques", note: "2026"}
          - {id: P-ANA-TRI-05, type: capacite, txt: "Résoudre cos x = cos a et sin x = sin a sur ℝ ou sur un intervalle"}
          - {id: P-ANA-TRI-06, type: capacite, txt: "Dériver cos et sin et en déduire leurs variations sur [0 ; 2π]"}

  - id: GEO
    nom: "Géométrie"
    chapitres:
      - id: PSC
        nom: "Produit scalaire et géométrie repérée"
        competences:
          - {id: P-GEO-PSC-01, type: connaissance, txt: "Produit scalaire de deux vecteurs : définitions par la norme et l'angle, par la projection, par les coordonnées dans une base orthonormée"}
          - {id: P-GEO-PSC-02, type: capacite, txt: "Projection orthogonale d'un point sur une droite et calcul du produit scalaire par projection", note: "2026"}
          - {id: P-GEO-PSC-03, type: capacite, txt: "Caractériser et démontrer l'orthogonalité par u·v = 0"}
          - {id: P-GEO-PSC-04, type: capacite, txt: "Calculer une longueur ou un angle avec le produit scalaire, théorème d'Al-Kashi"}
          - {id: P-GEO-PSC-05, type: demonstration, txt: "Démontrer une propriété simple du produit scalaire (symétrie, bilinéarité, identités avec la norme) et le théorème d'Al-Kashi"}
          - {id: P-GEO-PSC-06, type: capacite, txt: "Déterminer une équation cartésienne de droite par un vecteur normal, et de cercle par son centre et son rayon"}
          - {id: P-GEO-PSC-07, type: capacite, txt: "Déterminer l'ensemble des points M tels que MA·MB = k ou MA·u = k"}
      - id: VEC
        nom: "Droites et vecteurs"
        competences:
          - {id: P-GEO-VEC-01, type: capacite, txt: "Équation réduite et équation cartésienne ax + by + c = 0 d'une droite ; vecteur directeur"}
          - {id: P-GEO-VEC-02, type: capacite, txt: "Colinéarité, parallélisme, alignement, intersection de deux droites par système"}

  - id: PRO
    nom: "Probabilités et statistiques"
    chapitres:
      - id: PRB
        nom: "Probabilités"
        competences:
          - {id: P-PRO-PRB-01, type: capacite, txt: "Probabilité conditionnelle P_A(B) = P(A ∩ B)/P(A) ; distinguer P_A(B) de P_B(A)", piege: "Confondre P_A(B), P_B(A) et P(A ∩ B)"}
          - {id: P-PRO-PRB-02, type: capacite, txt: "Arbre pondéré, tableau croisé, formule des probabilités totales"}
          - {id: P-PRO-PRB-03, type: connaissance, txt: "Indépendance de deux événements : P(A ∩ B) = P(A) P(B)", note: "2026"}
          - {id: P-PRO-PRB-04, type: capacite, txt: "Succession de deux épreuves indépendantes, arbre ou tableau", note: "2026"}
          - {id: P-PRO-PRB-05, type: connaissance, txt: "Épreuve de Bernoulli, schéma de Bernoulli de n ≤ 4 épreuves, loi binomiale B(n, p)", note: "2026"}
          - {id: P-PRO-PRB-06, type: capacite, txt: "Calculer P(X = k), espérance, variance et écart type d'une variable aléatoire discrète"}
          - {id: P-PRO-PRB-07, type: connaissance, txt: "Linéarité de l'espérance E(aX + b) ; formule de König-Huygens V(X) = E(X²) - E(X)²", note: "2026"}
          - {id: P-PRO-PRB-08, type: demonstration, txt: "Démontrer que E(aX + b) = aE(X) + b et la formule de König-Huygens", note: "2026"}
      - id: STA
        nom: "Statistiques"
        competences:
          - {id: P-PRO-STA-01, type: capacite, txt: "Calculer moyenne, médiane, quartiles, écart type, et les interpréter"}
          - {id: P-PRO-STA-02, type: capacite, txt: "Comparer des distributions par boîtes à moustaches", note: "2026, décalé de la Seconde"}

  - id: ALGO
    nom: "Algorithmique et programmation"
    chapitres:
      - id: PYT
        nom: "Python"
        competences:
          - {id: P-ALGO-PYT-01, type: algorithme, txt: "Variables, boucles for et while, instructions conditionnelles, fonctions"}
          - {id: P-ALGO-PYT-02, type: algorithme, txt: "Listes : construction, parcours, ajout d'un élément, compréhension de liste"}
          - {id: P-ALGO-PYT-03, type: algorithme, txt: "Programmer le calcul des termes d'une suite et la recherche d'un seuil"}
          - {id: P-ALGO-PYT-04, type: algorithme, txt: "Programmer une approximation de racine par dichotomie ou une simulation aléatoire (random)"}
